      <rect x="403" y="64" width="97" height="30" rx="6" fill="#151b26"/>
      <text x="411" y="76" fill="#6b7385" font-size="5.5">SUCCESS RATE</text><text x="411" y="88" fill="#4ade80" font-size="10" font-weight="700">99.98%</text>


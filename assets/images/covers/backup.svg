      <rect x="102" y="120" width="34" height="10" rx="5" fill="#3b82f6"/>
      <rect x="136" y="120" width="52" height="10" fill="#8b5cf6"/>
      <rect x="188" y="120" width="24" height="10" fill="#22c55e"/>
      <rect x="212" y="120" width="12" height="10" fill="#f59e0b"/>

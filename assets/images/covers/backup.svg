<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 593 341" width="593" height="341" role="img"
    aria-label="Dosya saklama ve yedekleme konsolu bir dizüstü ekranında: depolama kullanımı, yedekleme işleri ve terminal günlüğü">

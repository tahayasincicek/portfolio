      <circle cx="314" cy="110" r="2.4" fill="#ff5f56"/><circle cx="323" cy="110" r="2.4" fill="#ffbd2e"/><circle cx="332" cy="110" r="2.4" fill="#27c93f"/>
      <text x="492" y="112.5" fill="#4b5563" font-size="5.5" text-anchor="end">backup.log</text>
      <line x1="304" y1="118" x2="501" y2="118" stroke="#1c2431"/>
      <g font-family="'Cascadia Code','Consolas',monospace" font-size="6">
        <text x="312" y="132" fill="#7ee787">$ <tspan fill="#e6edf3">backup run --incremental</tspan></text>
        <text x="312" y="146" fill="#8b949e">[12:04:02] scanning 128,430 files</text>
        <text x="312" y="160" fill="#8b949e">[12:04:09] delta <tspan fill="#f0b429">2,184</tspan> changed</text>
        <text x="312" y="174" fill="#8b949e">[12:04:31] encrypting AES-256 <tspan fill="#3fb950">&#10003;</tspan></text>
        <text x="312" y="188" fill="#8b949e">[12:04:58] compressing zstd&#8230;</text>
        <text x="312" y="202" fill="#8b949e">[12:05:12] upload 3.2 GB &#8594; vault-02</text>
        <text x="312" y="216" fill="#8b949e">[12:05:12] verify checksum <tspan fill="#3fb950">&#10003;</tspan></text>

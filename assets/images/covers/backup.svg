      <rect x="94" y="64" width="97" height="30" rx="6" fill="#151b26"/>
      <text x="102" y="76" fill="#6b7385" font-size="5.5">STORAGE USED</text><text x="102" y="88" fill="#e6ecf5" font-size="10" font-weight="700">3.2<tspan font-size="5.5" fill="#6b7385"> / 5 TB</tspan></text>
      <rect x="197" y="64" width="97" height="30" rx="6" fill="#151b26"/>
      <text x="205" y="76" fill="#6b7385" font-size="5.5">FILES</text><text x="205" y="88" fill="#e6ecf5" font-size="10" font-weight="700">128,430</text>

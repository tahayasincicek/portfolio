      <text x="162" y="185" fill="#c7cfda" font-size="7" font-weight="600">Ürün &amp; Stok Listesi</text>
      <rect x="430" y="177" width="63" height="12" rx="4" fill="#2b2350"/><text x="461" y="185.5" fill="#c4b5fd" font-size="5.5" text-anchor="middle">+ Yeni Ürün</text>
      <line x1="162" y1="192" x2="493" y2="192" stroke="#1c2431"/>
      <g font-size="5.5" fill="#5b6473">

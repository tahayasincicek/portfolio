<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 593 341" width="593" height="341" role="img"
    aria-label="Market otomasyon paneli bir dizüstü ekranında: ürün ve stok listesi, kategori dağılımı ve haftalık satış grafiği">
  <defs>
    <clipPath id="m-scr"><rect x="58" y="43" width="477" height="252"/></clipPath>
    <linearGradient id="m-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="47" y="6" width="499" height="300" rx="15" fill="#1c1c20" stroke="#3c3c44"/>
  <rect x="58" y="17" width="477" height="278" rx="5" fill="#0d1117"/>
  <path d="M58 22a5 5 0 0 1 5-5h467a5 5 0 0 1 5 5v21H58z" fill="#e8e9ed"/>
  <circle cx="72" cy="30" r="2.6" fill="#ff5f56"/><circle cx="82" cy="30" r="2.6" fill="#ffbd2e"/><circle cx="92" cy="30" r="2.6" fill="#27c93f"/>
  <rect x="176" y="24" width="220" height="13" rx="6.5" fill="#ffffff"/>
  <circle cx="188" cy="30.5" r="2.4" fill="#8b5cf6"/>
  <text x="196" y="33.5" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="7.5" fill="#6b7280">market-otomasyon/panel</text>

  <g clip-path="url(#m-scr)">

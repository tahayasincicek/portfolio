        <circle r="21" stroke="#8b5cf6" stroke-dasharray="46 86" transform="rotate(-90)"/>
        <circle r="21" stroke="#38bdf8" stroke-dasharray="30 102" transform="rotate(35)"/>
        <circle r="21" stroke="#22c55e" stroke-dasharray="24 108" transform="rotate(116)"/>
        <circle r="21" stroke="#f59e0b" stroke-dasharray="18 114" transform="rotate(181)"/>

      <rect x="90" y="240" width="50" height="16" rx="4" fill="#151b26"/>
      <circle cx="99" cy="248" r="4.6" fill="#8b5cf6"/><text x="108" y="250.5" fill="#9aa3b2" font-size="5.6">Kasiyer</text>

      <!-- KPI tiles -->
      <rect x="154" y="34" width="83" height="30" rx="6" fill="#151b26"/>
      <text x="162" y="46" fill="#6b7385" font-size="5.5">GUNLUK CIRO</text><text x="162" y="58" fill="#e6ecf5" font-size="10" font-weight="700">48.260</text>
      <rect x="242" y="34" width="83" height="30" rx="6" fill="#151b26"/>
      <text x="250" y="46" fill="#6b7385" font-size="5.5">SATIS ADEDI</text><text x="250" y="58" fill="#e6ecf5" font-size="10" font-weight="700">312</text>
      <rect x="330" y="34" width="83" height="30" rx="6" fill="#151b26"/>
      <text x="338" y="46" fill="#6b7385" font-size="5.5">URUN SAYISI</text><text x="338" y="58" fill="#e6ecf5" font-size="10" font-weight="700">1.842</text>

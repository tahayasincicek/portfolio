        <rect x="450" y="209" width="34" height="10" rx="5" fill="#14532d"/><text x="467" y="216.3" fill="#4ade80" font-size="5.5" text-anchor="middle">128</text>
        <text x="162" y="232">8690…517</text><text x="232" y="232">Süt 1 L</text><text x="330" y="232" fill="#9aa3b2">Gıda</text><text x="404" y="232">39,90 TL</text>
        <rect x="450" y="225" width="34" height="10" rx="5" fill="#14532d"/><text x="467" y="232.3" fill="#4ade80" font-size="5.5" text-anchor="middle">76</text>
        <text x="162" y="248">8690…233</text><text x="232" y="248">Zeytinyağı 750 ml</text><text x="330" y="248" fill="#9aa3b2">Gıda</text><text x="404" y="248">289,00 TL</text>
        <rect x="450" y="241" width="34" height="10" rx="5" fill="#4a2a0f"/><text x="467" y="248.3" fill="#fbbf24" font-size="5.5" text-anchor="middle">9</text>
        <text x="162" y="264">8690…908</text><text x="232" y="264">Çamaşır Deterjanı</text><text x="330" y="264" fill="#9aa3b2">Temizlik</text><text x="404" y="264">164,75 TL</text>
        <rect x="450" y="257" width="34" height="10" rx="5" fill="#4c1d1d"/><text x="467" y="264.3" fill="#f87171" font-size="5.5" text-anchor="middle">2</text>
      </g>

      <rect x="84" y="30" width="62" height="238" fill="#111722"/>
      <rect x="92" y="40" width="10" height="10" rx="3" fill="#8b5cf6"/>
      <text x="106" y="48.5" fill="#e8edf4" font-size="7.5" font-weight="700">Market</text>
      <g font-size="6">
        <rect x="90" y="62" width="50" height="14" rx="4" fill="#1e1b34"/><text x="98" y="71.5" fill="#c4b5fd" font-weight="600">Panel</text>
        <text x="98" y="90" fill="#7b8496">Ürünler</text>
        <text x="98" y="106" fill="#7b8496">Kategoriler</text>
        <text x="98" y="122" fill="#7b8496">Stok</text>
        <text x="98" y="138" fill="#7b8496">Satışlar</text>
        <text x="98" y="154" fill="#7b8496">Raporlar</text>

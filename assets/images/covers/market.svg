      </g>
      <path d="M162 146 L189 132 L216 138 L243 116 L270 122 L297 101 L324 108 L351 94 L351 154 L162 154 Z" fill="url(#m-area)"/>
      <path d="M162 146 L189 132 L216 138 L243 116 L270 122 L297 101 L324 108 L351 94" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linejoin="round"/>
      <g fill="#c4b5fd"><circle cx="243" cy="116" r="2"/><circle cx="297" cy="101" r="2"/><circle cx="351" cy="94" r="2.4"/></g>

        <circle cx="402" cy="171" r="4" fill="#c9ccd4" />
        <path d="M402 177c-5 0-8 3-9 8h18c-1-5-4-8-9-8z" fill="#c9ccd4" />
        <rect x="420" y="167" width="52" height="5" rx="2.5" fill="#4a4f59" />
        <rect x="420" y="177" width="24" height="4" rx="2" fill="#b9bcc4" />
